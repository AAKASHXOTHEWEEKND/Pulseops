name: CI

# Pull-request pipeline: lint, test, scan, validate IaC, and prove the business
# flow works by standing up an ephemeral environment in CI and smoke-testing it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Unit tests
        run: pytest --cov=pulseops --cov-report=term-missing

  iac-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - name: terraform validate
        run: terraform init -backend=false && terraform validate
        working-directory: infra/terraform

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan:
    name: Build images & vulnerability scan
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag (git SHA)
        id: vars
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          load: true
          tags: pulseops-app:${{ steps.vars.outputs.sha }}
          build-args: APP_VERSION=${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: pulseops-web:${{ steps.vars.outputs.sha }}
          build-args: APP_VERSION=${{ steps.vars.outputs.sha }}
      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pulseops-app:${{ steps.vars.outputs.sha }}
          format: table
          exit-code: "0" # report but don't fail the PR on findings (tune later)
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  ephemeral-smoke:
    name: Ephemeral env + smoke test
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: echo "APP_VERSION=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up --build -d
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then echo "ready"; exit 0; fi
            sleep 3
          done
          echo "API did not become ready"; docker compose logs; exit 1
      - name: Run smoke test (the business flow)
        run: python scripts/smoke_test.py --base-url http://localhost:8000 --timeout 60
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
